function P_(category, name, volume_ml, alc_pct, order) {
  const pure_alc_g = calcPureAlc(volume_ml, alc_pct);
  return { category, name, volume_ml, alc_pct, pure_alc_g: Math.round(pure_alc_g * 10) / 10, order, deletable: true };
}

// 月集計の閾値 (g/日)
const TH = { rest: 0, moderate: 20, mild: 40, heavy: 60 };

// セル色分け
function classifyDay(g) {
  if (g === 0 || g == null) return { label: 'rest', emoji: '♥️', bg: '#fff' };
  if (g <= TH.moderate) return { label: 'moderate', emoji: '😊', bg: '#fff8e1' };
  if (g <= TH.mild) return { label: 'mild', emoji: '😞', bg: '#ffe0b2' };
  if (g <= TH.heavy) return { label: 'heavy', emoji: '😟', bg: '#ffccbc' };
  return { label: 'danger', emoji: '💀', bg: '#ffcdd2' };
}

const MONTHLY_TARGET_G = 420;
const REST_TARGET = 10;

// ===== 状態 =====

function recomputeDailyPureG() {
  state.dailyPureG = {};
  for (const date in state.data) {
    const total = dayTotalG(state.data[date]);
    if (total != null) state.dailyPureG[date] = total;
  }
}
function saveState() {
  recomputeDailyPureG();
  localStorage.setItem('alcohol_data', JSON.stringify(state));
  sync.markDirtyAndPush();
}

// All presets = default + custom
function allPresets() {
  return { ...DEFAULT_PRESETS, ...state.customPresets };
}

function pad(n) { return n.toString().padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

// 日のentry → 純アル総量計算
function dayTotalG(entry) {
  if (!entry || entry.status !== 'drank') return entry?.status === 'no_drink' ? 0 : null;
  let total = 0;
  const presets = allPresets();
  for (const [pid, count] of Object.entries(entry.drinks || {})) {
    if (count > 0 && presets[pid]) total += presets[pid].pure_alc_g * count;
  }
  // 内訳が無い過去インポート日は記録済み合計g(total_pure_alc_g)を使う
  if (total === 0 && entry.total_pure_alc_g) total = entry.total_pure_alc_g;
  return Math.round(total * 10) / 10;
}

// ===== カレンダー描画 =====
function render() {
  const m = currentDate.getMonth() + 1;
  const y = currentDate.getFullYear();
  document.getElementById('currentMonthLabel').textContent = `${y}年${pad(m)}月`;

  const grid = document.getElementById('mainGrid');

    const entry = state.data[dateStr];

    `;

  renderMA30();

}

function dayTotalCups(entry) {
  if (!entry || entry.status !== 'drank') return entry?.status === 'no_drink' ? 0 : null;
  const drinks = entry.drinks || {};
  if (Object.keys(drinks).length === 0) return null; // 合計gのみの取り込み日は杯が不明
  let total = 0;
  for (const [pid, count] of Object.entries(drinks)) {
    if (count > 0) total += count;
  }
  return total;
}

function monthlyTotalsFor(y, m) {
  const prefix = `${y}-${pad(m)}`;
  let cups = 0, grams = 0, has = false;
  for (const [d, e] of Object.entries(state.data)) {
    if (!d.startsWith(prefix)) continue;
    const c = dayTotalCups(e);
    const g = dayTotalG(e);
    if (c != null) { cups += c; has = true; }
    if (g != null) { grams += g; }
  }
  return { cups, grams, has };
}

// 今日を基点に過去N日の移動平均 (記録ある日のみ集計、休肝日(0g)も含む)
function rollingAverage(days) {
  const today = new Date();
  let sumG = 0, sumCups = 0, n = 0, nCups = 0;
  for (let i = 0; i < days; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const entry = state.data[ymd(d)];
    if (!entry) continue;
    const g = dayTotalG(entry);
    const c = dayTotalCups(entry);
    if (g == null) continue;
    sumG += g;
    if (c != null) { sumCups += c; nCups++; } // 杯は内訳が分かる日だけで平均(g記録のみの取り込み日は除外)
    n++;
  }
  return { sumG, sumCups, n, nCups, avgG: n ? sumG/n : 0, avgCups: nCups ? sumCups/nCups : 0 };
}

// 過去7日間の純アル/日 ミニ棒グラフ
function renderWeekChart() {
  const el = document.getElementById('weekChart');
  if (!el) return;
  const today = new Date();
  const days = [];
  // 前日までの7日間で集計 (今日は未記録のため除外)
  for (let i = 7; i >= 1; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const ds = ymd(d);
    const entry = state.data[ds];
    const total = dayTotalG(entry);
    days.push({
      date: d,
      ds,
      g: total != null ? total : null,
      isToday: i === 1, // 最新日(前日)を強調
    });
  }
  // 色分け基準 (g)
  function colorClass(g) {
    if (g == null) return '';
    if (g === 0) return 'b0';
    if (g < 20) return 'b1';
    if (g < 40) return 'b2';
    if (g < 60) return 'b3';
    return 'b4';
  }
  const validG = days.filter(x => x.g != null).map(x => x.g);
  const maxG = Math.max(...validG, 40); // 最低40gスケール
  const recordedDays = validG.length;
  const restDays = validG.filter(g => g === 0).length;
  const avg7 = recordedDays > 0 ? validG.reduce((a,b)=>a+b,0) / recordedDays : 0;
  let avgClass = 'ok';
  if (avg7 >= 40) avgClass = 'alert';
  else if (avg7 >= 20) avgClass = 'warn';

  const bars = days.map(d => {
    const h = d.g == null ? 0 : Math.max(2, (d.g / maxG) * 70);
    const cls = colorClass(d.g);
    const valTxt = d.g == null ? '—' : (d.g === 0 ? '0' : Math.round(d.g));
    return `<div class="week-bar-col">
      <div class="week-bar-val">${valTxt}</div>
      <div class="week-bar ${cls}" style="height:${h}px"></div>
    </div>`;
  }).join('');

  const labels = days.map(d => {
    const md = `${d.date.getMonth()+1}/${d.date.getDate()}`;
    return `<div class="${d.isToday ? 'today-label' : ''}">${md}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="week-chart-title">
      <span>📊 直近7日 (純アル g/日)</span>
      <span class="wc-sub">${recordedDays}/7日記録</span>
    </div>
    <div class="week-chart-bars">${bars}</div>
    <div class="week-chart-labels">${labels}</div>
    <div class="week-chart-stats">
      <div class="ws-item"><div class="ws-label">休肝日</div><div class="ws-val ok">${restDays}日</div></div>
      <div class="ws-item"><div class="ws-label">7日平均</div><div class="ws-val ${avgClass}">${Math.round(avg7*10)/10}g</div></div>
      <div class="ws-item"><div class="ws-label">合計</div><div class="ws-val">${Math.round(validG.reduce((a,b)=>a+b,0))}g</div></div>
    </div>
  `;
}

function renderSummary() {
  const m = currentDate.getMonth() + 1;
  const y = currentDate.getFullYear();
  const prefix = `${y}-${pad(m)}`;
  const entries = Object.entries(state.data).filter(([d]) => d.startsWith(prefix));
  let total = 0, restDays = 0, modDays = 0, mildDays = 0, heavyDays = 0, dangerDays = 0, totalCups = 0;
  for (const [, e] of entries) {
    const g = dayTotalG(e);
    if (g == null) continue;
    if (g === 0) restDays++;
    else {
      total += g;
      const c = classifyDay(g);
      if (c.label === 'moderate') modDays++;
      else if (c.label === 'mild') mildDays++;
      else if (c.label === 'heavy') heavyDays++;
      else if (c.label === 'danger') dangerDays++;
    }
    const cups = dayTotalCups(e);
    if (cups != null) totalCups += cups;
  }
  total = Math.round(total * 10) / 10;
  totalCups = Math.round(totalCups * 10) / 10;
  const overTarget = total > MONTHLY_TARGET_G;
  const restClass = restDays >= REST_TARGET ? '✅' : '';

  // 直近3ヶ月の月平均 (今月含む3ヶ月、記録ある月のみ)
  const histCups = [], histG = [];
  for (let i = 0; i < 3; i++) {
    const d = new Date(y, m - 1 - i, 1);
    const r = monthlyTotalsFor(d.getFullYear(), d.getMonth() + 1);
    if (r.has) { histCups.push(r.cups); histG.push(r.grams); }
  }
  const ma3Cups = histCups.length > 0 ? Math.round((histCups.reduce((a,b)=>a+b,0)/histCups.length)*10)/10 : 0;
  const ma3G = histG.length > 0 ? Math.round((histG.reduce((a,b)=>a+b,0)/histG.length)*10)/10 : 0;
  const ma3Months = histCups.length;

  document.getElementById('summary').innerHTML = `
    <div class="summary-row main">
      <div>
        <div class="label">🍺 今月の純アルコール量</div>
        <div class="target">目標: ${MONTHLY_TARGET_G}g 以内</div>
      </div>
      <div class="value" style="color:${overTarget?'#FF6B6B':'#FF9800'}">${total}g</div>
    </div>
    <div class="summary-row"><span class="emoji">♥️</span><span class="label-text">休肝日 (目標${REST_TARGET}日) ${restClass}</span><span class="count">${restDays}日</span></div>
    <div class="summary-row"><span class="emoji">😊</span><span class="label-text">適量 (1-${TH.moderate}g)</span><span class="count">${modDays}日</span></div>
    <div class="summary-row"><span class="emoji">😞</span><span class="label-text">やや飲み過ぎ (${TH.moderate}-${TH.mild}g)</span><span class="count">${mildDays}日</span></div>
    <div class="summary-row"><span class="emoji">😟</span><span class="label-text">飲み過ぎ (${TH.mild}-${TH.heavy}g)</span><span class="count">${heavyDays}日</span></div>
    <div class="summary-row"><span class="emoji">💀</span><span class="label-text">危険 (${TH.heavy}g+)</span><span class="count">${dangerDays}日</span></div>
    <div class="summary-row" style="border-top:1px solid #f0f0f0; padding-top:8px; margin-top:4px;"><span class="emoji">🍶</span><span class="label-text">今月の総杯数</span><span class="count">${totalCups}杯</span></div>
    ${ma3Months >= 2 ? `<div class="summary-row"><span class="emoji">📊</span><span class="label-text">直近${ma3Months}ヶ月 月平均 (杯)</span><span class="count">${ma3Cups}杯</span></div>
    <div class="summary-row"><span class="emoji">📊</span><span class="label-text">直近${ma3Months}ヶ月 月平均 (g)</span><span class="count">${ma3G}g</span></div>` : ''}
  `;
}

// 30日移動平均セクション (直近7日の上に独立表示、月換算を先頭に)
function renderMA30() {

  const ma30_monthlyG = Math.round(ma30.avgG * 30);
  const ma30_clr = ma30_monthlyG > MONTHLY_TARGET_G ? '#FF6B6B' : '#4CAF50';
  document.getElementById('ma30Section').innerHTML = `
    <div class="summary-row main">
      <div>
        <div class="label">🔮 30日移動平均</div>
        <div class="target">今日基点・休肝日込み (月換算)</div>
      </div>
      <div class="value" style="color:${ma30_clr}">${ma30_monthlyG}g</div>
    </div>
    <div class="summary-row"><span class="emoji">🎯</span><span class="label-text">今日基点30日MA (g/日)</span><span class="count" style="color:${ma30_clr}">${ma30_avgG}g</span></div>
    <div class="summary-row"><span class="emoji">🎯</span><span class="label-text">今日基点30日MA (杯/日)<span style="font-size:10px;color:#999;"> ※内訳記録日のみ</span></span><span class="count">${ma30_avgCups}杯</span></div>
    <div class="summary-row" style="font-size:11px; color:#999; padding-top:0;"><span class="emoji" style="visibility:hidden">.</span><span class="label-text">記録日数: ${ma30.n}/30日 (杯内訳 ${ma30.nCups}日)</span><span class="count" style="font-weight:normal; color:#999;"></span></div>

// ===== 日次入力モーダル =====
function openModal(dateStr) {
  editingDate = dateStr;
  const entry = state.data[dateStr] || { status: 'drank', condition: 'normal', drinks: {} };
  editingState = {
    status: entry.status || 'drank',
    condition: entry.condition || 'normal',
    drinks: { ...(entry.drinks || {}) },
  };
  activeCategory = 'beer';

  const [y, mo, d] = dateStr.split('-');
  document.getElementById('modalDate').textContent = `📅 ${y}年${parseInt(mo)}月${parseInt(d)}日`;

  renderModal();
  document.getElementById('modal').classList.add('open');
}

function renderModal() {
  // 状態は常にnormal固定 (UI削除済み)
  editingState.condition = 'normal';

  // 飲酒した/してない/削除
  const actions = `
    <button class="action-btn ${editingState.status==='drank'?'active':''}" onclick="setStatus('drank')">飲酒した</button>
    <button class="action-btn ${editingState.status==='no_drink'?'active':''}" onclick="setStatus('no_drink')">飲酒してない</button>
    <button class="action-btn delete" onclick="deleteEntry()">削除</button>
  `;
  document.getElementById('actionRow').innerHTML = actions;

  // カテゴリタブ
  document.getElementById('categoryTabs').innerHTML = CATEGORIES.map(c =>
    `<div class="cat-tab ${activeCategory===c.id?'active':''}" onclick="setCategory('${c.id}')">
      <div class="cat-icon">${c.icon}</div>
      <div>${c.name}</div>
    </div>`
  ).join('');

  // ヘルプテキスト
  document.getElementById('catHelpText').textContent =
    activeCategory === 'custom' ? '左端の − で削除' : '';

  // プリセット一覧
  renderPresetList();
}

function renderPresetList() {
  const presets = allPresets();
  const items = Object.entries(presets)
    .filter(([, p]) => p.category === activeCategory)
    .sort((a, b) => (a[1].order || 0) - (b[1].order || 0));

  const list = document.getElementById('presetList');
  list.innerHTML = items.map(([id, p]) => {
    const count = editingState.drinks[id] || 0;
    const showDelBtn = p.deletable || activeCategory === 'custom';
    return `<div class="preset-item">
      ${showDelBtn ? `<button class="del-btn" onclick="deletePreset('${id}')">−</button>` : ''}
      <div class="preset-info">
        <div class="preset-name">${escapeHtml(p.name)}</div>
        <div class="preset-detail">${p.volume_ml}ml(ALC.${p.alc_pct}%) 純アル:${p.pure_alc_g}g</div>
      </div>
      <div class="preset-counter">
        <div class="count-display">${count}</div>
        <div class="counter-buttons">
          <button class="counter-btn" onclick="adjustCount('${id}',-1)">−</button>
          <button class="counter-btn" onclick="adjustCount('${id}',1)">＋</button>
        </div>
      </div>
    </div>`;
  }).join('') || '<div style="padding:30px 16px;text-align:center;color:#999;font-size:13px;">プリセットなし。下の「+」で追加してください。</div>';

  // 「+」ボタン表示制御 (カスタムタブのみ)
  document.getElementById('addPresetBtn').style.display = activeCategory === 'custom' ? 'block' : 'none';
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function setCondition(id) { editingState.condition = id; renderModal(); }
function setStatus(s) { editingState.status = s; if (s === 'no_drink') editingState.drinks = {}; renderModal(); }
function setCategory(id) { activeCategory = id; renderModal(); }

function adjustCount(presetId, delta) {
  const cur = editingState.drinks[presetId] || 0;
  const next = Math.max(0, cur + delta);
  if (next === 0) delete editingState.drinks[presetId];
  else editingState.drinks[presetId] = next;
  // 飲酒したに自動切替
  if (next > 0) editingState.status = 'drank';
  renderModal();
}

function deletePreset(presetId) {
  if (!confirm('このカスタムプリセットを削除しますか?(過去日の記録は残ります)')) return;
  delete state.customPresets[presetId];
  saveState();
  renderPresetList();
}

function deleteEntry() {
  if (!confirm('この日の記録を全部削除しますか?')) return;
  delete state.data[editingDate];
  saveState();
  closeModal();
  render();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function saveDay() {
  const total = (() => {
    if (editingState.status === 'no_drink') return 0;
    let t = 0; const ps = allPresets();
    for (const [id, c] of Object.entries(editingState.drinks)) {
      if (c > 0 && ps[id]) t += ps[id].pure_alc_g * c;
    }
    return Math.round(t * 10) / 10;
  })();
  state.data[editingDate] = {
    status: editingState.status,
    condition: editingState.condition,
    drinks: editingState.drinks,
    total_pure_alc_g: total,
  };
  saveState();
  closeModal();
  render();
}

// ===== カスタムプリセット追加 =====
function openCustomInput() {
  document.getElementById('ci_name').value = '';
  document.getElementById('ci_volume').value = '';
  document.getElementById('ci_alc').value = '';
  document.getElementById('ci_category').value = activeCategory === 'custom' ? 'custom' : activeCategory;
  updateCalcPreview();
  document.getElementById('customInput').classList.add('open');
  setTimeout(()=>document.getElementById('ci_name').focus(), 100);
}

function closeCustomInput() {
  document.getElementById('customInput').classList.remove('open');
}

function updateCalcPreview() {
  const ml = parseFloat(document.getElementById('ci_volume').value);
  const pct = parseFloat(document.getElementById('ci_alc').value);
  const el = document.getElementById('ci_preview');
  if (isFinite(ml) && isFinite(pct) && ml > 0 && pct > 0) {
    el.textContent = `純アルコール量: ${Math.round(calcPureAlc(ml, pct) * 10) / 10}g`;
  } else {
    el.textContent = '純アルコール量: -';
  }
}

['ci_volume','ci_alc'].forEach(id =>
  document.addEventListener('input', e => { if (e.target.id === id) updateCalcPreview(); })
);

function addCustomPreset() {
  const name = document.getElementById('ci_name').value.trim();
  const volume_ml = parseFloat(document.getElementById('ci_volume').value);
  const alc_pct = parseFloat(document.getElementById('ci_alc').value);
  const category = document.getElementById('ci_category').value;
  if (!name || !isFinite(volume_ml) || volume_ml <= 0 || !isFinite(alc_pct) || alc_pct < 0) {
    alert('全項目を正しく入力してください'); return;
  }
  const id = 'custom_' + Date.now();
  // order: 同カテゴリの最大+1
  const maxOrder = Object.values(allPresets()).filter(p => p.category === category).reduce((m, p) => Math.max(m, p.order || 0), 0);
  state.customPresets[id] = {
    category, name, volume_ml, alc_pct,
    pure_alc_g: Math.round(calcPureAlc(volume_ml, alc_pct) * 10) / 10,
    order: maxOrder + 1, deletable: true,
  };
  saveState();
  closeCustomInput();
  if (category === activeCategory || activeCategory === 'custom') {
    activeCategory = category;
    renderModal();
  }
}

// ===== Export/Import =====
function exportJSON() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `alcohol_${ymd(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        const dCount = Object.keys(imported.data || {}).length;
        const pCount = Object.keys(imported.customPresets || {}).length;
        if (!confirm(`記録${dCount}日 + カスタムプリセット${pCount}件を取り込みます(既存に統合、新が優先)`)) return;
        state.data = { ...state.data, ...(imported.data || {}) };
        state.customPresets = { ...state.customPresets, ...(imported.customPresets || {}) };
        saveState();
        render();
        alert('取り込み完了');
      } catch (err) {
        alert('JSONエラー: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===== Init =====
render();
sync.attachStatusElement(document.getElementById('syncStatusBtn'));

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ===== 起動時に repo から読み戻す (空localStorageが空pushで上書きするのを防ぐ / server-wins) =====
async function initialFetch(){
  const pat = sync.getPat(); if(!pat) return;
  try{
    const url = `https://api.github.com/repos/${sync.repoOwner}/${sync.repoName}/contents/${sync.filePath}?ref=${encodeURIComponent(sync.branch)}&t=${Date.now()}`;
    const res = await fetch(url,{cache:'no-store',headers:{'Authorization':`Bearer ${pat}`,'Accept':'application/vnd.github+json'}});
    if(!res.ok) return;
    const j = await res.json();
    const remote = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    if(remote && remote.data && Object.keys(remote.data).length>0){
      localStorage.setItem('alcohol_data', JSON.stringify(remote));
      state = loadState();
      const m = sync.getMeta(); m.sha=j.sha; m.lastSync=Date.now(); m.dirty=false; sync.setMeta(m); sync.updateStatus();
      render();
    }
  }catch(e){ console.warn('initialFetch failed',e); }
}
initialFetch();

</script>
